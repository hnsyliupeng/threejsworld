<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreeJSWorld — Photorealistic Botanical Lake Garden &amp; Asset Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0e1318; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      width: 256px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px);
      overflow-y: auto;
      background: rgba(13, 18, 24, 0.84); border: 1px solid #2b3949; border-radius: 10px;
      padding: 10px 12px; backdrop-filter: blur(10px); font-size: 11.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    body.clean #hud, body.clean #hudRestore { display: none; }
    #hud.collapsed { display: none; }
    #hudRestore {
      position: fixed; top: 12px; right: 12px; z-index: 21; display: none;
      background: rgba(13, 18, 24, 0.86); color: #7ee787; border: 1px solid #2b3949;
      border-radius: 8px; padding: 6px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    #hudRestore.visible { display: block; }
    .hdr { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
    h1 { font-size: 13px; font-weight: 700; color: #7ee787; }
    .sub { color: #90a4b8; font-size: 10.5px; margin-bottom: 8px; line-height: 1.35; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 6px; }
    select, button {
      background: #1a232e; color: #e6edf3; border: 1px solid #334355; border-radius: 6px;
      padding: 4px 7px; font-size: 11px; cursor: pointer;
    }
    select { max-width: 152px; }
    button:hover { background: #263344; }
    .cam-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 5px; }
    .cam-grid button.wide { grid-column: span 2; }
    .section { border-top: 1px solid #24303e; margin-top: 7px; padding-top: 7px; }
    #stats { font-family: ui-monospace, monospace; font-size: 10px; color: #9cb0c4; margin-top: 7px; line-height: 1.4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="hudRestore" type="button">Show Controls</button>

  <div id="hud">
    <div class="hdr">
      <h1>ThreeJSWorld Garden</h1>
      <button id="hudHide" type="button">Hide</button>
    </div>
    <div class="sub">Photorealistic Lake, Fountain, Flagstone Path, PBR Rockery, Trees, Flowers &amp; Turf (Zero Overlap)</div>

    <div class="row">
      <label for="viewMode">Asset Mode</label>
      <select id="viewMode">
        <option value="all">Garden (Full Scene)</option>
        <option value="tree">Tree Isolation</option>
        <option value="flower">Flower Macro</option>
        <option value="grass">Grass Turf Macro</option>
      </select>
    </div>

    <div class="row">
      <label for="speciesSelect">Species / Seed</label>
      <select id="speciesSelect">
        <option value="oak">Oak / Daisy / Fescue</option>
        <option value="pine">Pine / Rose / Foxtail</option>
        <option value="birch">Birch / Tulip / Sedge</option>
      </select>
    </div>

    <div class="section">
      <div class="row"><label><input type="checkbox" id="chkLeaves" checked /> Leaves (--without leaves)</label></div>
      <div class="row"><label><input type="checkbox" id="chkNormal" checked /> Surface::shaped Normals</label></div>
      <div class="row"><label><input type="checkbox" id="chkWind" checked /> Wind &amp; Water Motion</label></div>
      <div class="row"><label><input type="checkbox" id="chkWire" /> Wireframe Topology</label></div>
    </div>

    <div class="section">
      <div style="font-weight:600;margin-bottom:4px;">Camera Angles</div>
      <div class="cam-grid">
        <button data-cam="hero">Garden Hero</button>
        <button data-cam="closeup">Fountain &amp; Lake</button>
        <button data-cam="rockery">Rockery &amp; Path</button>
        <button data-cam="back">Opposite Rear</button>
        <button data-cam="top" class="wide">Top-Down Layout Audit</button>
      </div>
    </div>

    <div id="stats">Loading photorealistic garden…</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import {
      buildProceduralSkyDomeAndPMREM,
      buildBotanicalGardenGroup,
      buildTreeMeshGroup,
      buildFlowerMeshGroup,
      buildGrassFieldGroup,
      buildTerrainAndBoulder,
    } from '/runtime/three/createFloraScene.ts';

    const params = new URLSearchParams(window.location.search);
    if (params.get('hud') === '0') document.body.classList.add('clean');

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2('#a7c1d8', 0.0085);

    const { skyDome, envMap } = buildProceduralSkyDomeAndPMREM(renderer);
    scene.add(skyDome);
    scene.environment = envMap;
    scene.environmentIntensity = 0.72;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.03, 220);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;

    const hemi = new THREE.HemisphereLight('#ddecff', '#3b4d2b', 0.76);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight('#ffedd0', 3.05);
    sun.position.set(13, 10.5, 8.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 48;
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 14;
    sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.022;
    scene.add(sun);

    const windUniforms = { uTime: { value: 0 }, uWindStrength: { value: 1.0 } };

    const hudEl = document.getElementById('hud');
    const hudHideBtn = document.getElementById('hudHide');
    const hudRestoreBtn = document.getElementById('hudRestore');
    hudHideBtn.addEventListener('click', () => {
      hudEl.classList.add('collapsed');
      hudRestoreBtn.classList.add('visible');
    });
    hudRestoreBtn.addEventListener('click', () => {
      hudEl.classList.remove('collapsed');
      hudRestoreBtn.classList.remove('visible');
    });

    const viewSel = document.getElementById('viewMode');
    const spSel = document.getElementById('speciesSelect');
    const chkLeaves = document.getElementById('chkLeaves');
    const chkNormal = document.getElementById('chkNormal');
    const chkWind = document.getElementById('chkWind');
    const chkWire = document.getElementById('chkWire');

    if (params.get('view')) viewSel.value = params.get('view');
    if (params.get('species')) spSel.value = params.get('species');
    if (params.get('leaves') === '0') chkLeaves.checked = false;
    if (params.get('normal') === '0') chkNormal.checked = false;
    if (params.get('wind') === '0') chkWind.checked = false;
    if (params.get('wire') === '1') chkWire.checked = true;

    let activeGroup = new THREE.Group();
    let activeAnimatedMaps = [];
    let activeStreamUniforms = null;
    scene.add(activeGroup);

    const TREE_MAP = { oak: 'oak', pine: 'pine', birch: 'birch' };
    const FLOWER_MAP = { oak: 'daisy', pine: 'rose', birch: 'tulip' };
    const GRASS_MAP = { oak: 'fescue', pine: 'foxtail', birch: 'sedge' };

    function setCameraPreset(camKey) {
      const mode = viewSel.value;
      if (mode === 'flower') {
        if (camKey === 'closeup') {
          camera.position.set(0.24, 0.62, 0.32);
          controls.target.set(0, 0.46, 0);
        } else if (camKey === 'back') {
          camera.position.set(-0.35, 0.52, -0.42);
          controls.target.set(0, 0.34, 0);
        } else if (camKey === 'top') {
          camera.position.set(0.02, 0.88, 0.14);
          controls.target.set(0, 0.44, 0);
        } else {
          camera.position.set(0.45, 0.50, 0.52);
          controls.target.set(0, 0.30, 0);
        }
      } else if (mode === 'grass') {
        if (camKey === 'closeup') {
          camera.position.set(0.42, 0.38, 0.55);
          controls.target.set(0, 0.22, 0);
        } else if (camKey === 'back') {
          camera.position.set(-0.85, 0.46, -0.85);
          controls.target.set(0, 0.20, 0);
        } else if (camKey === 'top') {
          camera.position.set(0, 1.55, 0.35);
          controls.target.set(0, 0.12, 0);
        } else {
          camera.position.set(1.05, 0.62, 1.15);
          controls.target.set(0, 0.22, 0);
        }
      } else if (mode === 'tree') {
        const sp = spSel.value;
        const midY = sp === 'pine' ? 3.8 : 2.9;
        if (camKey === 'closeup') {
          camera.position.set(1.8, 1.45, 2.2);
          controls.target.set(0, 1.35, 0);
        } else if (camKey === 'back') {
          camera.position.set(-5.8, midY + 1.0, -7.2);
          controls.target.set(0, midY, 0);
        } else if (camKey === 'top') {
          camera.position.set(0.2, 11.5, 2.5);
          controls.target.set(0, midY, 0);
        } else {
          camera.position.set(6.4, midY + 0.9, 7.6);
          controls.target.set(0, midY, 0);
        }
      } else {
        // Full Photorealistic Botanical Lake Garden
        if (camKey === 'closeup') {
          // Fountain, water arcs, lily pads & lake shoreline macro
          camera.position.set(0.25, 1.85, 4.15);
          controls.target.set(2.20, 0.55, -0.30);
        } else if (camKey === 'rockery') {
          // PBR Scholar's Rockery (假山) & winding flagstone path + flowers
          camera.position.set(-1.35, 1.65, 3.05);
          controls.target.set(-3.65, 0.72, -1.25);
        } else if (camKey === 'back') {
          // Open north-east garden corridor looking back across Fountain, Lake, Flagstone Path & PBR Rockery
          camera.position.set(2.45, 2.20, -4.15);
          controls.target.set(-1.35, 0.75, 0.35);
        } else if (camKey === 'top') {
          // High bird's-eye view proving zero interference between lake, path, rockery, fountain & trees
          camera.position.set(0.1, 15.8, 1.6);
          controls.target.set(0.1, 0.0, -0.4);
        } else {
          // Garden Hero 3/4 panorama: shifts key garden focal zone clear of top-right HUD panel!
          camera.position.set(-1.35, 4.55, 11.45);
          controls.target.set(0.65, 0.85, -0.95);
        }
      }
      controls.update();
    }

    function rebuildScene() {
      scene.remove(activeGroup);
      activeGroup = new THREE.Group();
      activeAnimatedMaps = [];
      activeStreamUniforms = null;

      const mode = viewSel.value;
      const key = spSel.value;
      const showLeaves = chkLeaves.checked;
      const useNormal = chkNormal.checked;
      const wireframe = chkWire.checked;
      windUniforms.uWindStrength.value = chkWind.checked ? 1.0 : 0.0;

      if (mode === 'tree') {
        const { ground } = buildTerrainAndBoulder(useNormal, wireframe);
        const tree = buildTreeMeshGroup(TREE_MAP[key], 101, windUniforms, { showLeaves, useNormalMap: useNormal, wireframe });
        activeGroup.add(ground, tree);
      } else if (mode === 'flower') {
        const { ground } = buildTerrainAndBoulder(useNormal, wireframe);
        const flMain = buildFlowerMeshGroup(FLOWER_MAP[key], 21, windUniforms, { heightMeters: 0.48, useNormalMap: useNormal, wireframe });
        const flSide1 = buildFlowerMeshGroup(FLOWER_MAP[key], 29, windUniforms, { heightMeters: 0.39, useNormalMap: useNormal, wireframe });
        flSide1.position.set(-0.14, 0, 0.08);
        flSide1.rotation.y = 1.2;
        const flSide2 = buildFlowerMeshGroup(FLOWER_MAP[key], 37, windUniforms, { heightMeters: 0.42, useNormalMap: useNormal, wireframe });
        flSide2.position.set(0.15, 0, -0.06);
        flSide2.rotation.y = -0.8;
        const baseGrass = buildGrassFieldGroup('fescue', windUniforms, { clumpCount: 16, radius: 0.45, seed: 88, wireframe });
        activeGroup.add(ground, flMain, flSide1, flSide2, baseGrass);
      } else if (mode === 'grass') {
        const { ground } = buildTerrainAndBoulder(useNormal, wireframe);
        const g1 = buildGrassFieldGroup(GRASS_MAP[key], windUniforms, { clumpCount: 55, radius: 0.85, seed: 55, wireframe });
        activeGroup.add(ground, g1);
      } else {
        const built = buildBotanicalGardenGroup(windUniforms, {
          showLeaves,
          useNormalMap: useNormal,
          wireframe,
          gardenTheme: key,
        });
        activeGroup.add(built.group);
        activeAnimatedMaps = built.animatedMaps;
        activeStreamUniforms = built.waterStreamUniforms;
      }

      scene.add(activeGroup);

      let tris = 0;
      let meshes = 0;
      activeGroup.traverse((o) => {
        if (o.isMesh || o.isInstancedMesh) {
          meshes++;
          const cnt = o.isInstancedMesh ? o.count : 1;
          const idxCount = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
          tris += Math.round((idxCount / 3) * cnt);
        }
      });
      document.getElementById('stats').textContent =
        `Mode: ${mode} (${key}) | Meshes: ${meshes} | Triangles: ${tris.toLocaleString()}`;
    }

    const camParam = params.get('cam') || 'hero';
    rebuildScene();
    setCameraPreset(camParam);

    [viewSel, spSel, chkLeaves, chkNormal, chkWind, chkWire].forEach((el) => {
      el.addEventListener('change', () => {
        rebuildScene();
        if (el === viewSel || el === spSel) setCameraPreset('hero');
      });
    });

    document.querySelectorAll('button[data-cam]').forEach((btn) => {
      btn.addEventListener('click', () => setCameraPreset(btn.dataset.cam));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function stepAnimation(tSec) {
      const enabled = chkWind.checked;
      const t = enabled ? tSec : 0;
      windUniforms.uTime.value = t;
      if (activeStreamUniforms) activeStreamUniforms.uTime.value = t;
      for (const m of activeAnimatedMaps) {
        m.offset.set(t * 0.028, t * 0.019);
      }
    }

    window.__botanicalReady = true;
    window.__renderOnce = (t = 0.45) => {
      stepAnimation(t);
      renderer.render(scene, camera);
    };
    window.__setInspectionState = (opts = {}) => {
      if (opts.hud !== undefined) document.body.classList.toggle('clean', !opts.hud);
      if (opts.view !== undefined) viewSel.value = opts.view;
      if (opts.species !== undefined) spSel.value = opts.species;
      if (opts.leaves !== undefined) chkLeaves.checked = Boolean(opts.leaves);
      if (opts.normal !== undefined) chkNormal.checked = Boolean(opts.normal);
      if (opts.wind !== undefined) chkWind.checked = Boolean(opts.wind);
      if (opts.wire !== undefined) chkWire.checked = Boolean(opts.wire);
      rebuildScene();
      setCameraPreset(opts.cam || 'hero');
      window.__renderOnce(0.45);
    };

    const startTime = performance.now();
    if (params.get('pause') === '1') {
      window.__renderOnce(0.45);
    } else {
      renderer.setAnimationLoop(() => {
        stepAnimation((performance.now() - startTime) * 0.001);
        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
